name: kip-demo

services:
  kip-mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kip
      MARIADB_USER: kip
      MARIADB_PASSWORD: demo-password
      MARIADB_ROOT_PASSWORD: demo-root-password
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -pdemo-root-password --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kip-minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      STORAGE_BUCKET: kip-demo
    depends_on:
      - kip-minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://kip-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo "Waiting for MinIO...";
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/$$STORAGE_BUCKET;
        /usr/bin/mc anonymous set download local/$$STORAGE_BUCKET;

  db-seed:
    image: mariadb:11.4
    restart: "no"
    environment:
      DB_PORT: 3306
      DB_USERNAME: kip
      DB_PASSWORD: demo-password
      DB_NAME: kip
    depends_on:
      kip-mariadb:
        condition: service_healthy
      kip-backend:
        condition: service_healthy
    volumes:
      - ./infra-handoff/seed-rich.sql:/seed-rich.sql:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until [ "$$(mariadb -hkip-mariadb -P$$DB_PORT -u$$DB_USERNAME -p$$DB_PASSWORD $$DB_NAME -N -s 2>/dev/null -e "SELECT CASE WHEN EXISTS (SELECT 1 FROM \`user\` WHERE employee_id = 'asm-1234') AND EXISTS (SELECT 1 FROM \`group\` WHERE group_name = 'AI SW 마에스트로') AND EXISTS (SELECT 1 FROM document WHERE title = '데모 사용 가이드' AND group_id IS NULL) THEN 1 ELSE 0 END;")" = "1" ]; do
          echo "Waiting for kip-backend base seed...";
          sleep 2;
        done;
        if [ "$$(mariadb -hkip-mariadb -P$$DB_PORT -u$$DB_USERNAME -p$$DB_PASSWORD $$DB_NAME -N -s 2>/dev/null -e "SELECT CASE WHEN EXISTS (SELECT 1 FROM \`version\` WHERE message = 'seed-rich v1') THEN 1 ELSE 0 END;")" = "1" ]; then
          echo "seed-rich data already present. Skipping.";
          exit 0;
        fi;
        mariadb -hkip-mariadb -P$$DB_PORT -u$$DB_USERNAME -p$$DB_PASSWORD $$DB_NAME < /seed-rich.sql

  kip-backend:
    image: ghcr.io/lifedesigner88/kip-backend:demo
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kip-mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec '</dev/tcp/127.0.0.1/8080'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  kip-frontend:
    image: ghcr.io/lifedesigner88/kip-frontend:demo
    build:
      context: ./kip-fe
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kip-backend:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  mariadb_data:
  minio_data:

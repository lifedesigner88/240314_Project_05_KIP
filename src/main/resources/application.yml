spring:
  security:
    user:
      name: user
      password: password
  profiles:
    active: demo

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://kip-mariadb:3306/kip
    username: kip
    password: demo-password

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  features:
    push-enabled: false
    search-enabled: false
  jwt:
    secret-key: demo-jwt-secret-key-for-interview-only
    expiration-minutes: 720
    issuer: kip-demo
  security:
    allowed-origins: http://localhost:3000,https://vue-spring.huposit.kr
  storage:
    endpoint: http://kip-minio:9000
    public-base-url: /storage
    path-style-access: true
    auto-create-bucket: true

cloud:
  aws:
    s3:
      bucket: kip-demo
    credentials:
      access-key: minioadmin
      secret-key: minioadmin
      username: ${SEARCH_USERNAME:}
      password: ${SEARCH_PASSWORD:}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

aws:
  os:
    region: ap-northeast-2
    endpoint: ${SEARCH_ENDPOINT:localhost}
